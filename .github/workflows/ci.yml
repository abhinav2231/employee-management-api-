name: Aura Workforce OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aura_workforce_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Test Database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE aura_workforce_test_db;"

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/aura_workforce_db
        run: |
          alembic upgrade head

      - name: Run Master Dataset Seeder
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/aura_workforce_db
        run: |
          python -m scripts.seed

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/aura_workforce_db
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/aura_workforce_test_db
        run: |
          pytest -v
